# SmartStitch 配置模板（完整字段说明见 doc/03-配置文件规范.md）
# 复制此文件并改名为 <配置ID>.yaml 后再编辑；配置 ID 只能使用小写英文、数字和短横线。
schema_version: 2
id: new-config
name: 新配置
enabled: true
description: 请填写配置用途

# 主素材根目录。相对的“引子/利益点/结尾”目录都基于此处解析。
source_root: /请替换为/主素材目录
timeline: [pre_roll, hook, benefit_1, benefit_2, benefit_3, ending, end_card]

sources:
  pre_roll:
    # required=每条必需；optional=有素材时使用；disabled=停用。
    mode: required
    directory: /请替换为/前贴目录
    extensions: [.mp4, .mov, .mkv]
    default_weight: 1
    items:
      # 单个素材的 weight 越大，本批次计划出现次数越多；0 表示不抽取。
      - path: 示例前贴.mp4
        enabled: true
        weight: 1
        tags: [product-a]
  hook:
    mode: required
    # 建议填写该素材组的完整目录，网页中更直观，也不依赖 source_root 推断。
    directory: /请替换为/主素材目录/引子
    extensions: [.mp4]
    default_weight: 1
    items: []
  # 利益点段可增删和排序；每段会独立抽取一个人物片段。
  benefit_1:
    mode: required
    directory: /请替换为/主素材目录/利益点/1
    extensions: [.mp4]
    default_weight: 1
    items: []
  benefit_2:
    mode: required
    directory: /请替换为/主素材目录/利益点/2
    extensions: [.mp4]
    default_weight: 1
    items: []
  benefit_3:
    mode: required
    directory: /请替换为/主素材目录/利益点/3
    extensions: [.mp4]
    default_weight: 1
    items: []
  ending:
    mode: required
    directory: /请替换为/主素材目录/结尾
    extensions: [.mp4]
    default_weight: 1
    items: []
  end_card:
    mode: disabled
    directory: /请替换为/尾帧目录
    extensions: [.png, .jpg, .webp, .mp4]
    default_weight: 1
    # 静态图片作为尾帧时持续的秒数。
    image_duration_seconds: 1.5
    items: []

# 透明风险提示语图片始终覆盖在最终画面的最高层。
# 每个配置只指定一张固定图片；它会用于该配置生成的所有成片，不参与随机抽取。
benefit_overlays:
  mode: disabled
  file: /请替换为/唯一风险提示语图片.png
  placement:
    # original=原尺寸；fit=等比适配画布；stretch=拉伸铺满。
    scale_mode: original
    x: "0"
    y: "0"
    shrink_if_oversized: true
    opacity: 1.0
  timing:
    # full=全片；main=不含前贴和尾帧；benefits=全部利益点段；custom=自定义秒数。
    scope: benefits
    start_seconds: 0
    end_seconds: null

# 视觉去重：模糊背景→缩小前景→透明边框→风险提示语。
# 边框统一来自 SmartStitch 配置根下的“全局素材库/视觉去重边框”。
# 旧配置未填写本段时默认关闭。
visual_dedup:
  enabled: false
  foreground:
    # 0.70～1.00；简单模式“标准”为 0.90。
    scale: 0.90
  background:
    mode: gaussian_blur
    sigma: 20.0
    steps: 2
    brightness: 0.0
  border_overlay:
    # disabled=不叠加；optional=无兼容素材时允许生成；required=缺失时阻止生成。
    mode: disabled
    source: global_library
    # random=按权重为每条成片选择；fixed=固定使用一个素材。
    selection_mode: random
    fixed_asset_id: ""
    # 空列表表示使用全部启用且与输出画布兼容的全局素材。
    enabled_asset_ids: []
    # 可选项目级权重覆盖，键为全局 asset_id。
    weights: {}
    # 旧版项目内单边框兼容字段，新配置保持为空。
    file: ""
    media_kind: auto
    # exact=要求与输出画布同尺寸；stretch=拉伸铺满。
    scale_mode: exact
    playback: loop
    opacity: 1.0
    # auto 使用全局素材设置；边缘出现黑边时可覆盖为 premultiplied。
    alpha_mode: auto

matching:
  # 预留的素材标签匹配设置；固定风险提示语图片不使用此项。
  enabled: false
  strategy: product_tag
  allow_untagged_as_global: true
  on_missing_match: error

randomization:
  # quota_shuffle=整批按权重分配次数后打乱；independent_random=逐条独立随机。
  mode: quota_shuffle
  # 核心组合指“引子 + 全部启用利益点段 + 结尾”，不包含前贴、叠图和尾帧。
  # allow=允许重复，权重优先。
  # best_effort=保持权重次数并主动重排，尽量减少完整组合重复（推荐）。
  # strict=从唯一组合中加权无放回选择；组合唯一优先，素材次数可能偏离权重。
  duplicate_policy: best_effort
  default_seed: null

output:
  directory: output
  width: 720
  height: 1280
  fps: 30
  # Apple VideoToolbox 硬件编解码；不可用或失败时自动回退 libx264。
  video_codec: h264_videotoolbox
  pixel_format: yuv420p
  video_preset: medium
  # crf=恒定质量；vbr=目标平均码率。选择 vbr 时使用 video_bitrate_kbps。
  rate_control: vbr
  video_bitrate_kbps: 3000
  crf: 18
  audio_codec: aac
  audio_bitrate: 192k
  audio_sample_rate: 48000
  audio_channels: 2
  # 启用后，每个有声片段会先做响度均衡，再参与拼接。
  loudness:
    enabled: false
    # 目标综合响度，短视频常用 -14 LUFS；可在网页中滑动或直接输入。
    target_lufs: -14.0
    # 允许的响度范围与真峰值上限。
    loudness_range_lu: 7.0
    true_peak_dbtp: -1.5
    # 网页试听截取时长，只影响试听缓存，不影响正式成片。
    preview_duration_seconds: 12.0
  resize_mode: fit_pad
  background_color: black
  filename_template: "{config}_{date}_{batch}_{index:04d}.mp4"
  collision_policy: increment
  faststart: true
  # 通用视频项目可开启业务动态命名。非通用项目保持关闭。
  naming:
    enabled: false
    # 简单模式可直接修改的两个字段。
    product: ""
    benefit: ""
    # 成片序号起点。设为 50 时，本配置从 50、51、52……开始编号。
    sequence_start: 1
    template: "{product}-{benefit}-{talents}-{restriction_date}-{sequence}.mp4"
    source_metadata:
      # pool_* 表示通用时间线上的所有视频库，也可明确列出 pool_1、pool_2。
      categories: ["pool_*"]
      # SmartStitch 切片会保留原文件名并添加 __片段信息，开启后只解析前缀。
      strip_smartstitch_suffix: true
      # 必须包含 talent 和 restriction_date 命名分组。
      pattern: '^(?P<source_index>\d+)_(?P<talent>[^-]+)-(?P<source_title>.+)-(?P<restriction_date>\d{4}-\d{2}-\d{2})$'
      restriction_date_formats: ["%Y-%m-%d"]
      on_unmatched: error
    talent:
      merge: ordered_unique
      separator: "+"
    restriction_date:
      merge: earliest
      output_format: "%Y%m%d"
    duplicate_suffix: "-{serial:02d}"
  # 成片任务结束后将清单记录同步到飞书多维表格。
  # App ID/App Secret 保存在本机 data/integrations.yaml，不进入项目快照。
  feishu_base_sync:
    enabled: false
    # 粘贴 /wiki/ 或 /base/ 多维表格链接，前端测试连接后会写入稳定 table_id。
    base_url: ""
    table_id: ""
    trigger: job_terminal
    # all_items=成功与失败条目都保留；succeeded_only=只同步成功成片。
    row_scope: all_items
    write_mode: upsert

batch:
  default_count: 10
  max_count: 1000
  concurrency: 2
  retry_count: 1
  minimum_free_space_gb: 5

scanner:
  recursive: false
  ignore_hidden_files: true
  ignore_prefixes: ["._", ".~"]
  ignore_names: [.DS_Store]
