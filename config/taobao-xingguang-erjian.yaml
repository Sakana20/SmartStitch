schema_version: 2
id: taobao-xingguang-erjian
name: 淘宝闪购-星广一口价二剪
enabled: true
description: SmartStitch 标准视频库
source_root: /Volumes/Elements SE/陈鼎琦/饿了么整理/素材/星广一口价二剪
timeline:
- pre_roll
- hook
- benefit_1
- ending
- end_card
sources:
  pre_roll:
    mode: optional
    directory: 切片素材/前贴
    extensions:
    - .mp4
    - .mov
    - .mkv
    default_weight: 1.0
    image_duration_seconds: 1.5
    items: []
  hook:
    mode: required
    directory: 切片素材/引子
    extensions:
    - .mp4
    default_weight: 1.0
    image_duration_seconds: 1.5
    items: []
  benefit_1:
    mode: required
    directory: 切片素材/利益点/1
    extensions:
    - .mp4
    default_weight: 1.0
    image_duration_seconds: 1.5
    items: []
  ending:
    mode: required
    directory: 切片素材/结尾
    extensions:
    - .mp4
    default_weight: 1.0
    image_duration_seconds: 1.5
    items: []
  end_card:
    mode: optional
    directory: 切片素材/尾帧
    extensions:
    - .png
    - .jpg
    - .jpeg
    - .webp
    - .mp4
    default_weight: 1.0
    image_duration_seconds: 1.5
    items: []
benefit_overlays:
  mode: disabled
  file: ''
  image_duration_seconds: 1.5
  placement:
    scale_mode: original
    x: '0'
    y: '0'
    shrink_if_oversized: true
    opacity: 1.0
  timing:
    scope: benefits
    start_seconds: 0.0
    end_seconds: null
matching:
  enabled: false
  strategy: product_tag
  allow_untagged_as_global: true
  on_missing_match: error
randomization:
  mode: quota_shuffle
  duplicate_policy: best_effort
  default_seed: null
output:
  directory: /Volumes/Elements SE/陈鼎琦/饿了么整理/素材/星广一口价二剪/成片输出
  width: 720
  height: 1280
  fps: 30.0
  video_codec: libx264
  pixel_format: yuv420p
  video_preset: medium
  rate_control: crf
  video_bitrate_kbps: 3000
  crf: 18
  audio_codec: aac
  audio_bitrate: 192k
  audio_sample_rate: 48000
  audio_channels: 2
  loudness:
    enabled: false
    target_lufs: -14.0
    loudness_range_lu: 7.0
    true_peak_dbtp: -1.5
    preview_duration_seconds: 12.0
  resize_mode: fit_pad
  background_color: black
  filename_template: '{config}_{date}_{batch}_{index:04d}.mp4'
  collision_policy: increment
  faststart: true
batch:
  default_count: 10
  max_count: 1000
  concurrency: 1
  retry_count: 1
  minimum_free_space_gb: 5.0
scanner:
  recursive: false
  ignore_hidden_files: true
  ignore_prefixes:
  - ._
  - .~
  ignore_names:
  - .DS_Store
