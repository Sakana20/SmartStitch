[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartstitch"
version = "0.1.0"
description = "Local weighted video stitching tool powered by FFmpeg"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]
release = [
  "pyinstaller==6.16.0",
]

[project.scripts]
smartstitch = "smartstitch.cli:main"

[tool.setuptools]
packages = ["smartstitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
