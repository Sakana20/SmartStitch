name: Release macOS arm64

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    name: Build and release macOS arm64
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SMARTSTITCH_FFMPEG_PREFIX: ${{ github.workspace }}/build/ffmpeg-arm64
      UV_VERSION: "0.11.7"

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify runner, tag version, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]]
          [[ "${GITHUB_REF_TYPE}" == "tag" ]]
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main || {
            echo "Release tag commit is not part of origin/main history." >&2
            exit 1
          }
          project_version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          package_version="$(python3 -c 'from smartstitch import __version__; print(__version__)')"
          [[ "${project_version}" == "${package_version}" ]] || {
            echo "pyproject.toml and smartstitch.__version__ do not match." >&2
            exit 1
          }
          [[ "${GITHUB_REF_NAME}" == "v${project_version}" ]] || {
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${project_version}." >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip

      - name: Install locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen --python 3.12 --extra dev --extra release

      - name: Build bundled FFmpeg and ffprobe
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/*.sh
          packaging/build_ffmpeg.sh "${SMARTSTITCH_FFMPEG_PREFIX}"
          echo "${SMARTSTITCH_FFMPEG_PREFIX}/bin" >> "${GITHUB_PATH}"

      - name: Run test suite with bundled media tools
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest
          node tests/timeline_math_test.js
          node tests/frontend_layout_test.js
          node tests/path_input_test.js

      - name: Build and ad-hoc sign SmartStitch.app
        shell: bash
        run: |
          set -euo pipefail
          uv run packaging/build_app.sh "${GITHUB_REF_NAME}"
          signature_details="$(codesign -d --verbose=4 dist/SmartStitch.app 2>&1)"
          printf '%s\n' "${signature_details}"
          grep -q '^Signature=adhoc$' <<< "${signature_details}"
          codesign --verify --deep --strict --verbose=2 dist/SmartStitch.app
          codesign --verify --strict --verbose=2 \
            dist/SmartStitch.app/Contents/Resources/bin/ffmpeg
          codesign --verify --strict --verbose=2 \
            dist/SmartStitch.app/Contents/Resources/bin/ffprobe

      - name: Smoke-test packaged application
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/smartstitch-smoke"
          SMARTSTITCH_DATA_DIRECTORY="${smoke_root}" \
          SMARTSTITCH_CONFIG_DIRECTORY="${smoke_root}/config" \
          SMARTSTITCH_PORT=18766 \
          SMARTSTITCH_HEADLESS=1 \
            dist/SmartStitch.app/Contents/MacOS/SmartStitch &
          app_pid=$!
          trap 'kill "${app_pid}" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            if curl --fail --silent --noproxy '*' \
              http://127.0.0.1:18766/api/v1/system/health \
              > "${RUNNER_TEMP}/health.json"; then
              break
            fi
            sleep 0.1
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"] + "/health.json").read_text())
          assert payload["ok"] is True
          assert "/SmartStitch.app/Contents/" in payload["ffmpeg"]
          assert "/SmartStitch.app/Contents/" in payload["ffprobe"]
          PY
          curl --fail --silent --noproxy '*' http://127.0.0.1:18766/ \
            > "${RUNNER_TEMP}/index.html"
          grep -q '<title>SmartStitch' "${RUNNER_TEMP}/index.html"
          test -f "${smoke_root}/data/smartstitch.db"
          kill "${app_pid}"
          wait "${app_pid}" || true
          trap - EXIT

      - name: Create and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          packaging/create_dmg.sh "${GITHUB_REF_NAME}"
          dmg="dist/SmartStitch-${GITHUB_REF_NAME}-macOS-arm64.dmg"
          hdiutil verify "${dmg}"

      - name: Create GitHub Release and upload DMG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg="dist/SmartStitch-${GITHUB_REF_NAME}-macOS-arm64.dmg"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${dmg}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${dmg}" \
              --verify-tag \
              --generate-notes \
              --title "SmartStitch ${GITHUB_REF_NAME}"
          fi
